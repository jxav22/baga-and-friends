name: Build & Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_TAG: "4.3-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary + templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-local
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}-linux-templates-v1

      - name: Install Godot ${{ env.GODOT_TAG }} + web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot-local" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd /tmp
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -o godot.zip
          mv Godot_v${GODOT_TAG}_linux.x86_64 "$HOME/godot-local/godot"
          chmod +x "$HOME/godot-local/godot"
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p /tmp/tpl && cd /tmp/tpl
          unzip -o /tmp/templates.tpz
          # tpz contains templates/*
          cp -a templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_nothreads_release.zip"
          echo "${GODOT_VERSION}.stable" > "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-local" >> "$GITHUB_PATH"

      - name: Import project
        run: |
          godot --version
          godot --headless --import --path . || true
          # Ensure import finishes
          godot --headless --editor --quit-after 2 --path . || true

      - name: Smoke test
        run: godot --headless --path . --scene res://scenes/SmokeTest.tscn

      - name: Export Web (Compatibility / single-threaded)
        run: |
          mkdir -p export/web dist
          godot --headless --path . --export-release "Web" export/web/index.html
          test -f export/web/index.html
          test -f export/web/index.wasm
          test -f export/web/index.pck
          touch export/web/.nojekyll
          ls -lh export/web

      - name: Package itch.io ZIP
        run: |
          (cd export/web && zip -r9 ../../dist/baga-and-friends-web-itch.zip .)
          ls -lh dist/baga-and-friends-web-itch.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

      - name: Upload itch ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: baga-and-friends-itch-web
          path: dist/baga-and-friends-web-itch.zip
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
