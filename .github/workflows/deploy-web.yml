name: Build & Deploy Web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_TAG: "4.3-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for asset verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify approved runtime artwork
        run: |
          python -m pip install Pillow==12.2.0
          python scripts/prepare_art.py --check

      - name: Cache Godot binary + templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-local
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}-linux-templates-v1

      - name: Install Godot ${{ env.GODOT_TAG }} + web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot-local" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd /tmp
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -o godot.zip
          mv Godot_v${GODOT_TAG}_linux.x86_64 "$HOME/godot-local/godot"
          chmod +x "$HOME/godot-local/godot"
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p /tmp/tpl && cd /tmp/tpl
          unzip -o /tmp/templates.tpz
          # tpz contains templates/*
          cp -a templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_nothreads_release.zip"
          echo "${GODOT_VERSION}.stable" > "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-local" >> "$GITHUB_PATH"

      - name: Import project
        run: |
          set -euo pipefail
          godot --version
          godot --headless --import --path . 2>&1 | tee /tmp/baga-import.log
          ! grep -E 'SCRIPT ERROR|ERROR:' /tmp/baga-import.log

      - name: Smoke test
        timeout-minutes: 2
        run: |
          set -euo pipefail
          godot --headless --path . --scene res://scenes/SmokeTest.tscn 2>&1 | tee /tmp/baga-smoke.log
          grep -q 'SMOKE PASS' /tmp/baga-smoke.log
          ! grep -E 'SCRIPT ERROR|ERROR:' /tmp/baga-smoke.log

      - name: Export Web (Compatibility / single-threaded)
        run: |
          mkdir -p export/web dist
          godot --headless --path . --export-release "Web" export/web/index.html
          test -f export/web/index.html
          test -f export/web/index.wasm
          test -f export/web/index.pck
          touch export/web/.nojekyll
          ls -lh export/web

      - name: Package itch.io ZIP
        run: |
          (cd export/web && zip -r9 ../../dist/baga-and-friends-web-itch.zip .)
          ls -lh dist/baga-and-friends-web-itch.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

      - name: Upload itch ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: baga-and-friends-itch-web
          path: dist/baga-and-friends-web-itch.zip
          if-no-files-found: error

      - name: Publish gh-pages branch (branch-source fallback)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: export/web
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Continues even when Pages site not yet created in Settings
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (Actions source)
        id: deployment
        uses: actions/deploy-pages@v4
